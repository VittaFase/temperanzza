name: NO-REGRESSION

on:
  push:
    branches:
      - rebrand-kinders-experience
  pull_request:
    branches:
      - main

concurrency:
  group: no-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REBRAND_FILES: >-
    src/components/site/FeaturedProducts.tsx
    src/components/site/FeaturedRow.tsx
    src/components/site/PromoAnnouncement.tsx
    src/components/site/RecipeShowcase.tsx
    src/components/site/SiteFooter.tsx
    src/components/site/SiteHeader.tsx
    src/components/site/SiteHero.tsx
    src/routes/cozinha.$slug.tsx
    src/routes/cozinha.tsx
    src/routes/product.$handle.tsx

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

  rebrand-lint:
    name: Rebrand lint gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Normalize formatting in isolated runner
        run: bunx eslint $REBRAND_FILES --fix

      - name: Lint normalized rebrand implementation
        run: bunx eslint $REBRAND_FILES

  legacy-lint-audit:
    name: Lint audit (legacy baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit repository lint debt
        run: bun run lint
