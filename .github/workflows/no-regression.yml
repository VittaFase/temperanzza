name: NO-REGRESSION

on:
  push:
    branches:
      - rebrand-kinders-experience
  pull_request:
    branches:
      - main

concurrency:
  group: no-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

  lint-audit:
    name: Lint audit (legacy baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit lint debt
        run: bun run lint
